<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор школьного расписания</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        .dashboard {
            max-width: 1000px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            color: #666;
            transition: all 0.3s;
        }
        .tab.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            margin-bottom: -2px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #c33;
            display: none;
        }
        .error.show {
            display: block;
        }
        .success {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #3c3;
            display: none;
        }
        .success.show {
            display: block;
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        #dashboard {
            display: none;
        }
        #dashboard.active {
            display: block;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        .logout-btn {
            width: auto;
            padding: 8px 20px;
            background: #e74c3c;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .section {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
        }
        .section h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 22px;
        }
        .timetable-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .timetable-card h3 {
            color: #667eea;
            margin-bottom: 5px;
        }
        .timetable-card p {
            color: #999;
            font-size: 12px;
        }
        .delete-btn {
            width: auto;
            padding: 6px 12px;
            background: #e74c3c;
            font-size: 12px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
    </style>
</head>
<body>
    <!-- Форма входа/регистрации -->
    <div id="authContainer" class="container">
        <h1>🎓 Генератор школьного расписания</h1>
        <p class="subtitle">Войдите или создайте аккаунт</p>

        <div class="tabs">
            <button class="tab active" onclick="showLogin()">Вход</button>
            <button class="tab" onclick="showRegister()">Регистрация</button>
        </div>

        <div id="loginForm" class="form-section active">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>🔒 Пароль</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            <button onclick="login()">Войти</button>
            <div id="loginError" class="error"></div>
        </div>

        <div id="registerForm" class="form-section">
            <div class="form-group">
                <label>👤 ФИО</label>
                <input type="text" id="regFullName" placeholder="Иванов Иван Иванович">
            </div>
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="regEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>🏫 Название школы</label>
                <input type="text" id="regSchool" placeholder="Школа №123 (необязательно)">
            </div>
            <div class="form-group">
                <label>🔒 Пароль</label>
                <input type="password" id="regPassword" placeholder="••••••••">
            </div>
            <button onclick="register()">Зарегистрироваться</button>
            <div id="regError" class="error"></div>
            <div id="regSuccess" class="success"></div>
        </div>
    </div>

    <!-- Дашборд -->
    <div id="dashboard" class="container dashboard">
        <div class="header">
            <div>
                <h1> Панель управления</h1>
                <p class="subtitle" id="userInfo">Загрузка...</p>
            </div>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>

        <div class="grid">
            <div class="section">
                <h2>📅 Генерация расписания</h2>
                <div class="form-group">
                    <label>Название расписания</label>
                    <input type="text" id="timetableName" placeholder="Например: 5А класс">
                </div>
                <div class="form-group">
                    <label>Количество классов</label>
                    <input type="number" id="numClasses" min="1" max="20" value="1">
                </div>
                <button onclick="generateTimetable()">Сгенерировать расписание</button>
                <div id="generateError" class="error"></div>
                <div id="generateSuccess" class="success"></div>
            </div>

            <div class="section">
                <h2> Мои расписания</h2>
                <div id="savedTimetables">
                    <p style="color: #999; text-align: center;">Загрузка...</p>
                </div>
            </div>

            <div class="section">
                <h2> Статистика</h2>
                <div class="stat-card">
                    <h3>Всего расписаний</h3>
                    <div class="stat-value" id="totalTimetables">0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Проверка авторизации при загрузке
        window.onload = function() {
            const token = localStorage.getItem('access_token');
            if (token) {
                showDashboard();
            }
        };

        function showLogin() {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', i === 0);
            });
            document.querySelectorAll('.form-section').forEach((f, i) => {
                f.classList.toggle('active', i === 0);
            });
        }

        function showRegister() {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', i === 1);
            });
            document.querySelectorAll('.form-section').forEach((f, i) => {
                f.classList.toggle('active', i === 1);
            });
        }

        function showDashboard() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');

            const fullName = localStorage.getItem('full_name') || 'Пользователь';
            document.getElementById('userInfo').textContent = `Добро пожаловать, ${fullName}!`;

            loadTimetables();
        }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_id');
            localStorage.removeItem('full_name');
            location.reload();
        }

        async function login() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');

            if (!email || !password) {
                errorDiv.textContent = 'Заполните все поля';
                errorDiv.classList.add('show');
                return;
            }

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('full_name', data.full_name);
                    showDashboard();
                } else {
                    errorDiv.textContent = data.detail || 'Ошибка входа';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = 'Ошибка соединения с сервером';
                errorDiv.classList.add('show');
            }
        }

        async function register() {
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const schoolName = document.getElementById('regSchool').value.trim();
            const password = document.getElementById('regPassword').value;
            const errorDiv = document.getElementById('regError');
            const successDiv = document.getElementById('regSuccess');

            if (!fullName || !email || !password) {
                errorDiv.textContent = 'Заполните все обязательные поля';
                errorDiv.classList.add('show');
                return;
            }

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        full_name: fullName,
                        email,
                        password,
                        school_name: schoolName || null
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    successDiv.textContent = '✅ Регистрация успешна! Вход...';
                    successDiv.classList.add('show');
                    errorDiv.classList.remove('show');

                    setTimeout(() => {
                        localStorage.setItem('access_token', data.access_token);
                        localStorage.setItem('user_id', data.user_id);
                        localStorage.setItem('full_name', data.full_name);
                        showDashboard();
                    }, 1000);
                } else {
                    errorDiv.textContent = data.detail || 'Ошибка регистрации';
                    errorDiv.classList.add('show');
                    successDiv.classList.remove('show');
                }
            } catch (error) {
                errorDiv.textContent = 'Ошибка соединения с сервером';
                errorDiv.classList.add('show');
            }
        }

        async function generateTimetable() {
            const name = document.getElementById('timetableName').value.trim();
            const numClasses = parseInt(document.getElementById('numClasses').value) || 1;
            const errorDiv = document.getElementById('generateError');
            const successDiv = document.getElementById('generateSuccess');

            if (!name) {
                errorDiv.textContent = 'Введите название расписания';
                errorDiv.classList.add('show');
                return;
            }

            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ name, num_classes: numClasses })
                });

                const data = await response.json();

                if (response.ok) {
                    successDiv.textContent = '✅ Расписание сгенерировано и сохранено!';
                    successDiv.classList.add('show');
                    errorDiv.classList.remove('show');
                    loadTimetables();
                } else {
                    errorDiv.textContent = data.detail || 'Ошибка генерации';
                    errorDiv.classList.add('show');
                    successDiv.classList.remove('show');
                }
            } catch (error) {
                errorDiv.textContent = 'Ошибка соединения с сервером';
                errorDiv.classList.add('show');
            }
        }

        async function loadTimetables() {
            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch('/timetables', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                const container = document.getElementById('savedTimetables');

                if (response.ok && Array.isArray(data) && data.length > 0) {
                    container.innerHTML = data.map(t => `
                        <div class="timetable-card">
                            <div>
                                <h3>${t.name}</h3>
                                <p>Создано: ${new Date(t.created_at).toLocaleString('ru-RU')}</p>
                            </div>
                            <button class="delete-btn" onclick="deleteTimetable(${t.id})">Удалить</button>
                        </div>
                    `).join('');
                    document.getElementById('totalTimetables').textContent = data.length;
                } else {
                    container.innerHTML = '<p style="color: #999; text-align: center;">Нет сохраненных расписаний</p>';
                    document.getElementById('totalTimetables').textContent = '0';
                }
            } catch (error) {
                container.innerHTML = '<p style="color: #c33; text-align: center;">Ошибка загрузки</p>';
            }
        }

        async function deleteTimetable(id) {
            if (!confirm('Удалить это расписание?')) return;

            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch(`/timetables/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    loadTimetables();
                }
            } catch (error) {
                console.error('Delete error:', error);
            }
        }

        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('loginForm').classList.contains('active')) {
                    login();
                } else if (document.getElementById('registerForm').classList.contains('active')) {
                    register();
                }
            }
        });
    </script>
</body>
</html>
