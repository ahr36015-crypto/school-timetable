<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор школьного расписания</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: none;
            font-size: 16px;
            color: #666;
            transition: all 0.3s;
        }
        .tab.active {
            color: #667eea;
            border-bottom: 3px solid #667eea;
            margin-bottom: -2px;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #c33;
            display: none;
        }
        .error.show {
            display: block;
        }
        .success {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #3c3;
            display: none;
        }
        .success.show {
            display: block;
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Генератор школьного расписания</h1>
        <p class="subtitle">Войдите или создайте аккаунт</p>

        <div class="tabs">
            <button class="tab active" onclick="showLogin()">Вход</button>
            <button class="tab" onclick="showRegister()">Регистрация</button>
        </div>

        <!-- Форма входа -->
        <div id="loginForm" class="form-section active">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>🔒 Пароль</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button onclick="login()">Войти</button>
            <div id="loginError" class="error"></div>
        </div>

        <!-- Форма регистрации -->
        <div id="registerForm" class="form-section">
            <div class="form-group">
                <label>👤 ФИО</label>
                <input type="text" id="regFullName" placeholder="Иванов Иван Иванович" required>
            </div>
            <div class="form-group">
                <label> Email</label>
                <input type="email" id="regEmail" placeholder="your@email.com" required>
            </div>
            <div class="form-group">
                <label>🏫 Название школы</label>
                <input type="text" id="regSchool" placeholder="Школа №123 (необязательно)">
            </div>
            <div class="form-group">
                <label>🔒 Пароль</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
            </div>
            <button onclick="register()">Зарегистрироваться</button>
            <div id="regError" class="error"></div>
            <div id="regSuccess" class="success"></div>
        </div>
    </div>

    <script>
        // Переключение между формами
        function showLogin() {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', i === 0);
            });
            document.querySelectorAll('.form-section').forEach((f, i) => {
                f.classList.toggle('active', i === 0);
            });
        }

        function showRegister() {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', i === 1);
            });
            document.querySelectorAll('.form-section').forEach((f, i) => {
                f.classList.toggle('active', i === 1);
            });
        }

        // Функция входа
        async function login() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');

            if (!email || !password) {
                errorDiv.textContent = 'Заполните все поля';
                errorDiv.classList.add('show');
                return;
            }

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'  // ВАЖНО: JSON!
                    },
                    body: JSON.stringify({  // ВАЖНО: JSON.stringify!
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Сохраняем токен
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('full_name', data.full_name);

                    // Показываем успех и перенаправляем
                    errorDiv.textContent = '✅ Вход выполнен успешно!';
                    errorDiv.classList.remove('error');
                    errorDiv.classList.add('success', 'show');

                    setTimeout(() => {
                        // Здесь можно перенаправить на главную страницу
                        alert('Добро пожаловать, ' + data.full_name + '!');
                    }, 500);
                } else {
                    errorDiv.textContent = data.detail || 'Ошибка входа';
                    errorDiv.classList.remove('success');
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = 'Ошибка соединения с сервером';
                errorDiv.classList.add('show');
            }
        }

        // Функция регистрации
        async function register() {
            const fullName = document.getElementById('regFullName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const schoolName = document.getElementById('regSchool').value.trim();
            const password = document.getElementById('regPassword').value;
            const errorDiv = document.getElementById('regError');
            const successDiv = document.getElementById('regSuccess');

            if (!fullName || !email || !password) {
                errorDiv.textContent = 'Заполните все обязательные поля';
                errorDiv.classList.add('show');
                return;
            }

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'  // ВАЖНО: JSON!
                    },
                    body: JSON.stringify({  // ВАЖНО: JSON.stringify!
                        full_name: fullName,
                        email: email,
                        password: password,
                        school_name: schoolName || null
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // Показываем успех
                    successDiv.textContent = '✅ Регистрация успешна! Теперь войдите.';
                    successDiv.classList.add('show');
                    errorDiv.classList.remove('show');

                    // Очищаем форму
                    document.getElementById('regFullName').value = '';
                    document.getElementById('regEmail').value = '';
                    document.getElementById('regSchool').value = '';
                    document.getElementById('regPassword').value = '';

                    // Переключаем на вход через 2 секунды
                    setTimeout(() => {
                        showLogin();
                        successDiv.classList.remove('show');
                        document.getElementById('loginEmail').value = email;
                    }, 2000);
                } else {
                    errorDiv.textContent = data.detail || 'Ошибка регистрации';
                    errorDiv.classList.add('show');
                    successDiv.classList.remove('show');
                }
            } catch (error) {
                console.error('Register error:', error);
                errorDiv.textContent = 'Ошибка соединения с сервером';
                errorDiv.classList.add('show');
            }
        }

        // Обработка Enter в полях ввода
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('loginForm').classList.contains('active')) {
                    login();
                } else {
                    register();
                }
            }
        });
    </script>
</body>
</html>
