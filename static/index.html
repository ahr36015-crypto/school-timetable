<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор школьного расписания</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 { text-align: center; color: #333; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .tabs { display: flex; margin-bottom: 30px; border-bottom: 2px solid #eee; }
        .tab {
            flex: 1; padding: 10px; text-align: center; cursor: pointer;
            border: none; background: none; font-size: 16px; color: #666;
        }
        .tab.active { color: #667eea; border-bottom: 3px solid #667eea; font-weight: 600; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        input {
            width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 15px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
        }
        button:hover { transform: translateY(-2px); }
        .error {
            background: #fee; color: #c33; padding: 12px;
            border-radius: 8px; margin-top: 15px;
            border-left: 4px solid #c33; display: none;
        }
        .error.show { display: block; }
        .success {
            background: #efe; color: #3c3; padding: 12px;
            border-radius: 8px; margin-top: 15px;
            border-left: 4px solid #3c3; display: none;
        }
        .success.show { display: block; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        #dashboard { display: none; }
        #dashboard.active { display: block; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding-bottom: 20px; border-bottom: 2px solid #eee;
        }
        .logout-btn { width: auto; padding: 8px 20px; background: #e74c3c; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .section { background: #f8f9fa; padding: 25px; border-radius: 12px; }
        .section h2 { margin-bottom: 20px; color: #333; font-size: 22px; }
        .timetable-card {
            background: white; padding: 15px; border-radius: 8px;
            margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .timetable-card h3 { color: #667eea; margin-bottom: 5px; }
        .timetable-card p { color: #999; font-size: 12px; }
        .delete-btn {
            width: auto; padding: 6px 12px; background: #e74c3c;
            font-size: 12px; margin-top: 10px;
        }
        .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; }
        .stat-value { font-size: 36px; font-weight: bold; color: #667eea; }
    </style>
</head>
<body>
    <div id="authContainer" class="container">
        <h1> Генератор школьного расписания</h1>
        <p class="subtitle">Войдите или создайте аккаунт</p>
        <div class="tabs">
            <button class="tab active" onclick="showLogin()">Вход</button>
            <button class="tab" onclick="showRegister()">Регистрация</button>
        </div>
        <div id="loginForm" class="form-section active">
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="loginEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>🔒 Пароль</label>
                <input type="password" id="loginPassword" placeholder="••••••••">
            </div>
            <button onclick="login()">Войти</button>
            <div id="loginError" class="error"></div>
        </div>
        <div id="registerForm" class="form-section">
            <div class="form-group">
                <label>👤 ФИО</label>
                <input type="text" id="regFullName" placeholder="Иванов Иван Иванович">
            </div>
            <div class="form-group">
                <label>📧 Email</label>
                <input type="email" id="regEmail" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label> Школа</label>
                <input type="text" id="regSchool" placeholder="Школа №123">
            </div>
            <div class="form-group">
                <label>🔒 Пароль</label>
                <input type="password" id="regPassword" placeholder="••••••••">
            </div>
            <button onclick="register()">Зарегистрироваться</button>
            <div id="regError" class="error"></div>
        </div>
    </div>

    <div id="dashboard" class="container">
        <div class="header">
            <div>
                <h1> Панель управления</h1>
                <p class="subtitle" id="userInfo">Загрузка...</p>
            </div>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
        <div class="grid">
            <div class="section">
                <h2>📅 Генерация расписания</h2>
                <div class="form-group">
                    <label>Название</label>
                    <input type="text" id="timetableName" placeholder="5А класс">
                </div>
                <div class="form-group">
                    <label>Количество классов</label>
                    <input type="number" id="numClasses" min="1" max="20" value="1">
                </div>
                <button onclick="generateTimetable()">Сгенерировать</button>
                <div id="genError" class="error"></div>
                <div id="genSuccess" class="success"></div>
            </div>
            <div class="section">
                <h2>📋 Мои расписания</h2>
                <div id="timetablesList">
                    <p style="color:#999;text-align:center">Загрузка...</p>
                </div>
            </div>
            <div class="section">
                <h2>📈 Статистика</h2>
                <div class="stat-card">
                    <h3>Всего расписаний</h3>
                    <div class="stat-value" id="totalCount">0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem('access_token')) showDashboard();
        };

        function showLogin() {
            document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===0));
            document.querySelectorAll('.form-section').forEach((f,i) => f.classList.toggle('active', i===0));
        }
        function showRegister() {
            document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===1));
            document.querySelectorAll('.form-section').forEach((f,i) => f.classList.toggle('active', i===1));
        }
        function showDashboard() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            document.getElementById('userInfo').textContent =
                'Добро пожаловать, ' + (localStorage.getItem('full_name') || 'Пользователь') + '!';
            loadTimetables();
        }
        function logout() {
            localStorage.clear();
            location.reload();
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const err = document.getElementById('loginError');

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('full_name', data.full_name);
                    showDashboard();
                } else {
                    err.textContent = data.detail;
                    err.classList.add('show');
                }
            } catch(e) {
                err.textContent = 'Ошибка соединения';
                err.classList.add('show');
            }
        }

        async function register() {
            const full_name = document.getElementById('regFullName').value;
            const email = document.getElementById('regEmail').value;
            const school_name = document.getElementById('regSchool').value;
            const password = document.getElementById('regPassword').value;
            const err = document.getElementById('regError');

            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({full_name, email, password, school_name})
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_id', data.user_id);
                    localStorage.setItem('full_name', data.full_name);
                    showDashboard();
                } else {
                    err.textContent = data.detail;
                    err.classList.add('show');
                }
            } catch(e) {
                err.textContent = 'Ошибка соединения';
                err.classList.add('show');
            }
        }

        async function generateTimetable() {
            const name = document.getElementById('timetableName').value;
            const num_classes = parseInt(document.getElementById('numClasses').value);
            const err = document.getElementById('genError');
            const succ = document.getElementById('genSuccess');

            try {
                const res = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('access_token')
                    },
                    body: JSON.stringify({name, num_classes})
                });
                const data = await res.json();
                if (res.ok) {
                    succ.textContent = '✅ Расписание создано!';
                    succ.classList.add('show');
                    err.classList.remove('show');
                    loadTimetables();
                } else {
                    err.textContent = data.detail;
                    err.classList.add('show');
                }
            } catch(e) {
                err.textContent = 'Ошибка';
                err.classList.add('show');
            }
        }

        async function loadTimetables() {
            const container = document.getElementById('timetablesList');
            try {
                const res = await fetch('/timetables', {
                    headers: {'Authorization': 'Bearer ' + localStorage.getItem('access_token')}
                });
                const data = await res.json();

                if (res.ok && Array.isArray(data) && data.length > 0) {
                    container.innerHTML = data.map(t =>
                        '<div class="timetable-card">' +
                        '<h3>' + t.name + '</h3>' +
                        '<p>Создано: ' + new Date(t.created_at).toLocaleString('ru-RU') + '</p>' +
                        '<button class="delete-btn" onclick="deleteTimetable('+t.id+')">Удалить</button>' +
                        '</div>'
                    ).join('');
                    document.getElementById('totalCount').textContent = data.length;
                } else {
                    container.innerHTML = '<p style="color:#999;text-align:center">Нет расписаний</p>';
                    document.getElementById('totalCount').textContent = '0';
                }
            } catch(e) {
                container.innerHTML = '<p style="color:#c33;text-align:center">Ошибка</p>';
            }
        }

        async function deleteTimetable(id) {
            if (!confirm('Удалить?')) return;
            try {
                await fetch('/timetables/' + id, {
                    method: 'DELETE',
                    headers: {'Authorization': 'Bearer ' + localStorage.getItem('access_token')}
                });
                loadTimetables();
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>
